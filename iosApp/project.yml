# Receita do projeto do Xcode, para o XcodeGen.
#
# O .xcodeproj não vai para o Git: o Codemagic gera a cada build com
# `xcodegen generate` (dentro desta pasta). Mudou algo do projeto do iPhone —
# permissão, versão, nome — muda aqui.
name: BBSolution
options:
  bundleIdPrefix: br.com.selebi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # Versão que aparece na loja; o número do build o Codemagic troca a cada envio.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic

targets:
  BBSolution:
    type: application
    platform: iOS
    # Esquema compartilhado: é por ele que o Codemagic compila (xcodebuild -scheme).
    scheme: {}
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.selebi.app
        PRODUCT_NAME: BBSolution
        # Só iPhone (no iPad abre no tamanho do iPhone).
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # O script que compila o Kotlin precisa sair da caixa de areia do Xcode.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # O código do app (Kotlin) chega como o framework "Shared".
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          - "-lsqlite3"
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: BBSolution
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Sem isto o iPhone abre o app em modo de compatibilidade, com tarjas pretas.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # O Compose desenha a 120 Hz nos iPhones que têm.
        CADisableMinimumFrameDurationOnPhone: true
        # Só HTTPS padrão: sem a pergunta de exportação de criptografia a cada envio.
        ITSAppUsesNonExemptEncryption: false
        # Rastreamento em campo com a tela apagada, entre o "Estou a caminho" e o fim da OS.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          O BBSolution registra onde cada etapa da ordem de serviço aconteceu e,
          entre o "Estou a caminho" e o fim do atendimento, mostra ao escritório
          onde você está.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          O BBSolution mostra ao escritório onde você está só entre o "Estou a
          caminho" e o fim do atendimento, mesmo com a tela apagada.
        NSCameraUsageDescription: >-
          A câmera tira as fotos da vistoria e lê o código de barras da etiqueta
          do inversor.
        NSPhotoLibraryUsageDescription: >-
          Para anexar à ordem de serviço uma foto que já está no celular.
    preBuildScripts:
      - name: Compilar o Kotlin
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
