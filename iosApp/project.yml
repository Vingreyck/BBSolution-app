# Receita do projeto do Xcode, para o XcodeGen.
#
# O .xcodeproj não vai para o Git: o Codemagic gera a cada build com
# `xcodegen generate` (dentro desta pasta). Mudou algo do projeto do iPhone —
# permissão, versão, nome — muda aqui.
name: BBSolution
options:
  bundleIdPrefix: br.com.selebi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # Versão que aparece na loja; o número do build o Codemagic troca a cada envio.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic

targets:
  BBSolution:
    type: application
    platform: iOS
    # Esquema compartilhado: é por ele que o Codemagic compila (xcodebuild -scheme).
    scheme: {}
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.selebi.app
        PRODUCT_NAME: BBSolution
        # Só iPhone (no iPad abre no tamanho do iPhone).
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # O código do app (Kotlin) chega como o framework "Shared", compilado
        # pelo Gradle antes do Xcode (ver codemagic.yaml): o do simulador em
        # modo de teste, o do iPhone de verdade em modo de produção.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        # O Kotlin sai só para os chips da Apple (arm64), que é o que os
        # simuladores dos Macs atuais usam.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          - "-lsqlite3"
    # Avisos (push) de OS: o perfil de assinatura precisa ter "Push Notifications"
    # ligado no identificador br.com.selebi.app. "production" vale para o
    # TestFlight e a App Store.
    entitlements:
      path: iosApp/BBSolution.entitlements
      properties:
        aps-environment: production
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: BBSolution
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Sem isto o iPhone abre o app em modo de compatibilidade, com tarjas pretas.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # O Compose desenha a 120 Hz nos iPhones que têm.
        CADisableMinimumFrameDurationOnPhone: true
        # Só HTTPS padrão: sem a pergunta de exportação de criptografia a cada envio.
        ITSAppUsesNonExemptEncryption: false
        # Rastreamento em campo com a tela apagada, entre o "Estou a caminho" e o fim da OS.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          O BBSolution registra onde cada etapa da ordem de serviço aconteceu e,
          entre o "Estou a caminho" e o fim do atendimento, mostra ao escritório
          onde você está.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          O BBSolution mostra ao escritório onde você está só entre o "Estou a
          caminho" e o fim do atendimento, mesmo com a tela apagada.
        NSCameraUsageDescription: >-
          A câmera tira as fotos da vistoria e lê o código de barras da etiqueta
          do inversor.
        NSMicrophoneUsageDescription: >-
          O microfone grava o som do vídeo curto do local onde o inversor vai
          ficar, na vistoria.
        NSPhotoLibraryUsageDescription: >-
          Para anexar à ordem de serviço uma foto que já está no celular.
