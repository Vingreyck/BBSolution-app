# Memória do Gradle contida de propósito: a máquina de desenvolvimento tem 8 GB
# e divide com o Android Studio, o Docker e o Next. O Kotlin compila dentro do
# próprio daemon do Gradle ("in-process") em vez de abrir um segundo processo
# com a própria memória.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Endereço da API do Selebi: a VM da Intec, com HTTPS. Debug e release falam
# com o mesmo servidor — ninguém precisa rodar `npm run dev` para testar o app.
#
# O nome é provisório (sslip.io resolve o próprio IP escrito no nome). Quando a
# BB tiver domínio, troca aqui e o app precisa ser reinstalado nos celulares.
#
# Para voltar a testar contra o `npm run dev` do computador, sobrescreva no
# local.properties: selebi.api.url=http://10.0.2.2:3000/api/app/v1/
# (10.0.2.2 é o "localhost" do computador visto de dentro do emulador).
selebi.api.url=https://app.selebi.com.br/api/app/v1/
selebi.api.url.release=https://app.selebi.com.br/api/app/v1/
